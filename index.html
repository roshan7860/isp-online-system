<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Credit Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loginPage" class="center">
  <div class="card login">
    <h1>Customer Credit Manager</h1><p>Sign in to continue</p>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header><h2>Customer Credit Manager</h2><div class="row headerActions"><button id="settingsBtn" class="secondary" title="Account settings" aria-label="Account settings"><span class="iconSvg" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="M19.4 15l1.1 1-1.4 2.4-1.4-.6a7.9 7.9 0 0 1-1.5.9l-.2 1.5h-2.8l-.2-1.5a7.9 7.9 0 0 1-1.5-.9l-1.4.6-1.4-2.4 1.1-1a7.2 7.2 0 0 1 0-1.8l-1.1-.9 1.4-2.4 1.4.6a7.9 7.9 0 0 1 1.5-.9l.2-1.5h2.8l.2 1.5a7.9 7.9 0 0 1 1.5.9l1.4-.6 1.4 2.4-1.1.9a7.2 7.2 0 0 1 0 1.8Z"/></svg></span></button><button id="logoutBtn" class="secondary">Logout</button></div></header>
  <main>
    <section class="stats">
      <div class="stat"><span>Customers</span><b id="customerCount">0</b></div>
      <div class="stat"><span>Total Credit</span><b id="totalCredit">0</b></div>
      <div class="stat"><span>Total Debit</span><b id="totalDebit">0</b></div>
      <div class="stat"><span>Outstanding</span><b id="totalBalance">0</b></div>
    </section>

    <section class="grid">
      <div class="card">
        <div class="row between"><h3>Top 5 Debtors</h3><button id="addCustomerBtn">+ Customer</button></div>
        <div id="topDebtors"></div>
      </div>
      <div class="card">
        <h3>Customers</h3>
        <input id="search" placeholder="Search customer...">
        <div id="customers"></div>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden">
 <div class="card modalBox">
  <div class="row between"><h3 id="modalTitle">Add Customer</h3><button id="closeModal" class="secondary">×</button></div>
  <input id="customerName" placeholder="Customer name">
  <input id="customerWhatsapp" placeholder="WhatsApp number (e.g. 937XXXXXXXXX)">
  <input id="customerAddress" placeholder="Address">
  <div class="row">
    <button id="saveCustomer">Save Customer</button>
    <button id="deleteCustomerBtn" class="danger hidden">Delete</button>
  </div>
  <div id="customerMsg" class="msg"></div>
 </div>
</div>

<div id="settingsModal" class="modal hidden">
 <div class="card modalBox">
  <div class="row between"><h3>Account Settings</h3><button id="closeSettings" class="secondary" aria-label="Close settings"><span class="iconSvg" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></span></button></div>
  <p class="muted">Change the email address or password for your signed-in account.</p>
  <label for="settingsEmail">New email</label>
  <input id="settingsEmail" type="email" placeholder="New email address">
  <label for="settingsCurrentPassword">Current password (required to verify)</label>
  <input id="settingsCurrentPassword" type="password" autocomplete="current-password" placeholder="Current password">
  <label for="settingsNewPassword">New password (leave empty if unchanged)</label>
  <input id="settingsNewPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters">
  <button id="saveSettings">Save Settings</button>
  <div id="settingsMsg" class="msg" role="status"></div>
 </div>
</div>

<div id="customerPage" class="modal hidden">
 <div class="card detail">
  <div class="row between">
    <div><h3 id="detailName"></h3><p id="detailPhone"></p></div>
    <div class="row detailActions">
      <button id="detailReminder" class="iconBtn" title="Send WhatsApp reminder">🔔</button>
      <button id="closeDetail" class="secondary">×</button>
    </div>
  </div>
  <div class="balance" id="detailBalance">0 AFN</div>
  <p class="muted">Outstanding balance</p>
  <div class="transactionForm">
   <select id="txType"><option value="credit">قرض (Customer owes)</option><option value="debit">رسید (Customer paid)</option></select>
   <input id="txAmount" type="number" min="0" step="0.01" placeholder="Amount">
   <input id="txNote" placeholder="Note">
   <label class="switchRow"><input id="waToggle" type="checkbox" checked><span>WhatsApp</span></label>
   <button id="saveTx">Save Transaction</button>
  </div>
  <h4>Transaction History</h4><div id="history"></div>
 </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
