<!doctype html>
<html lang="ps" dir="rtl">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta name="theme-color" content="#172b4d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>ستاسو د حساب معلومات</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body { direction: rtl; }
    .hidden { display: none !important; }
  </style>
</head>


<body>

<main class="portal">

  <div class="card portalCard">

    <h1>
      ستاسو د حساب معلومات
    </h1>


    <div id="loading">
      مهرباني وکړئ، لږ انتظار وکړئ...
    </div>


    <div id="account" class="hidden">

      <div class="portalInfo">

        <p>
          <b>نوم:</b>
          <span id="pName"></span>
        </p>


      </div>


      <div class="portalBalance">

        <span>
          پر تاسو پاتې پیسې
        </span>

        <b id="pBalance">
          0.00
        </b>

        <small>
          افغانۍ
        </small>

      </div>


      <h3>
        د حساب تاریخ
      </h3>


      <div
        id="pHistory"
        class="portalTx"
      ></div>

    </div>


    <div
      id="error"
      class="msg hidden"
    ></div>

  </div>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


import {
  firebaseConfig
} from "./firebase-config.js";


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


const token =
  new URLSearchParams(
    location.search
  ).get("token");


const $ =
  id => document.getElementById(id);


const money =
  n =>
    Number(n || 0)
      .toLocaleString(
        "en-US",
        {
          minimumFractionDigits: 0, maximumFractionDigits: 2
        }
      );


const esc =
  s =>
    String(s ?? "")
      .replace(
        /[&<>"']/g,
        m => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[m])
      );


const date =
  x =>
    x?.toDate
      ? x.toDate().toLocaleString("en-GB", {
          hour: "2-digit",
          minute: "2-digit",
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour12: true
        })
      : "";


async function load() {

  try {

    if (!token) {

      throw new Error(
        "د حساب لینک ناسم دی."
      );

    }


    // =========================
    // PUBLIC ACCOUNT
    // =========================

    const ref =
      doc(
        db,
        "public_accounts",
        token
      );


    const snap =
      await getDoc(ref);


    if (!snap.exists()) {

      throw new Error(
        "دا حساب پیدا نه شو. مهرباني وکړئ له حساب ورکوونکي سره اړیکه ونیسئ."
      );

    }


    const c =
      snap.data();


    $("pName").textContent =
      c.name || "";



    $("pBalance").textContent =
      money(c.balance);


    // =========================
    // TRANSACTIONS
    // =========================

    const txRef =
      collection(
        db,
        "public_accounts",
        token,
        "transactions"
      );


    const ts =
      await getDocs(txRef);


    const rows =
      ts.docs
        .map(d => ({
          id: d.id,
          ...d.data()
        }))
        .sort(
          (a, b) =>
            (
              b.createdAt
                ?.toMillis?.() ?? 0
            ) -
            (
              a.createdAt
                ?.toMillis?.() ?? 0
            )
        );


    $("pHistory").innerHTML =
      rows.length

        ? rows.map(t => `

          <div
            class="tx ${
              t.type === "credit"
                ? "txCredit"
                : "txDebit"
            }"
          >

            <div
              class="row between"
            >

              <b>

                ${
                  t.type === "credit"
                    ? "قرض"
                    : "رسید"
                }

                —
                ${money(t.amount)}
                افغانۍ

              </b>


              <span>
                ${date(t.createdAt)}
              </span>

            </div>


            <div class="note">

              ${esc(t.note || "")}

            </div>

          </div>

        `).join("")

        : `
          <p class="muted">
            تر اوسه کومه معامله نشته.
          </p>
        `;


    $("loading")
      .classList
      .add("hidden");


    $("account")
      .classList
      .remove("hidden");


  } catch (e) {

    console.error(
      "Public account error:",
      e
    );


    $("loading")
      .classList
      .add("hidden");


    $("error").textContent =
      e.message ||
      "د حساب معلومات ونه لوستل شول.";


    $("error")
      .classList
      .remove("hidden");

  }

}


load();

</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('PWA service worker:', err)));
}
</script>
</body>
</html>
